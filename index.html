<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0d0f" />
    <meta name="description" content="A learning workspace with Firebase account sign-in." />
    <title>Northstar — Learning workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./script.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/home" aria-label="Northstar home"><span class="brand-symbol">✳</span><span>NORTHSTAR</span></a>
        <div class="side-label">WORKSPACE</div>
        <nav class="side-nav" aria-label="Main navigation">
          <a href="#/home" data-route="home"><span class="nav-icon">⌂</span>Home</a>
          <a href="#/learn" data-route="learn"><span class="nav-icon">▤</span>Learn<span class="nav-count">18</span></a>
          <a href="#/videos" data-route="videos"><span class="nav-icon">▷</span>Recordings</a>
          <a href="#/saved" data-route="saved"><span class="nav-icon">▣</span>Saved</a>
          <a href="#/sessions" data-route="sessions"><span class="nav-icon">◷</span>Live sessions</a>
          <a href="#/perks" data-route="perks"><span class="nav-icon">◇</span>Member perks</a>
        </nav>
        <div class="sidebar-divider"></div>
        <div class="membership-mini">
          <div class="plan-orbit">✳</div>
          <span class="side-label">YOUR MEMBERSHIP</span>
          <strong>Open library</strong>
          <p>Upgrade for guided paths, study tools, and member events.</p>
          <a href="#/membership" class="side-upgrade">Explore plans <span>↗</span></a>
        </div>
        <button class="sidebar-user" data-action="profile">
          <span class="user-avatar">A</span><span class="user-details"><b>Alex Morgan</b><small>Open account</small></span><span class="kebab">···</span>
        </button>
      </aside>

      <main class="main-column">
        <header class="topbar">
          <button class="mobile-brand" data-route-click="home"><span>✳</span> NORTHSTAR</button>
          <div class="mobile-title" id="mobile-title">Home</div>
          <div class="topbar-actions">
            <button class="search-trigger" data-action="search"><span class="search-icon">⌕</span><span>Search lessons, videos…</span><kbd>⌘ K</kbd></button>
            <button class="icon-button notification-trigger" aria-label="Notifications" data-action="notifications"><span>♧</span><i class="unread-dot"></i></button>
            <button class="icon-button theme-trigger" aria-label="Switch theme" data-action="theme"><span>☾</span></button>
            <button class="user-avatar top-avatar" aria-label="Open account" data-action="profile">A</button>
          </div>
        </header>
        <section class="page-content" id="page-content" aria-live="polite"></section>
      </main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <a href="#/home" data-route="home"><span>⌂</span><small>Home</small></a>
        <a href="#/learn" data-route="learn"><span>▤</span><small>Learn</small></a>
        <a href="#/videos" data-route="videos"><span>▷</span><small>Videos</small></a>
        <a href="#/saved" data-route="saved"><span>▣</span><small>Saved</small></a>
        <button data-action="more"><span>···</span><small>More</small></button>
      </nav>
    </div>
    <div class="overlay-root" id="overlay-root"></div>
    <div class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
